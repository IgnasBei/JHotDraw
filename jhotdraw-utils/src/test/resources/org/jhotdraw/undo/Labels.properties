# Test-classpath copy of the resource bundle that
# org.jhotdraw.undo.UndoRedoManager loads at runtime.
#
# The production bundle physically lives in jhotdraw-core
# (jhotdraw-core/src/main/resources/org/jhotdraw/undo/Labels.properties)
# even though the consuming class lives in jhotdraw-utils. So the
# utils test classpath needs its own copy in order to instantiate
# the manager without dragging the whole jhotdraw-core module in.
edit.redo.accelerator.default=ctrl Y
edit.redo.accelerator.mac=meta shift Z
edit.redo.accelerator=${edit.redo.accelerator.[$os]}
edit.redo.mnemonic=
edit.redo.text=Redo
edit.redo.toolTipText=
edit.undo.accelerator.default=ctrl Z
edit.undo.accelerator.mac=meta Z
edit.undo.accelerator=${edit.undo.accelerator.[$os]}
edit.undo.mnemonic=
edit.undo.text=Undo
edit.undo.toolTipText=
